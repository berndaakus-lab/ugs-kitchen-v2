<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#151212" />
  <title>Offline · UGs POS</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: #FFF8F0; color: #151212; font-family: Inter, system-ui, sans-serif; padding: 16px; box-sizing: border-box; }
    .card { background: #fff; border-radius: 16px; padding: 28px 24px; max-width: 360px; text-align: center;
            box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    img { width: 64px; height: 64px; border-radius: 14px; }
    h1 { font-size: 20px; margin: 16px 0 8px; }
    p { font-size: 14px; color: #555; line-height: 1.5; margin: 0 0 20px; }
    button { width: 100%; border: 0; border-radius: 12px; padding: 14px; font-size: 16px; font-weight: 700;
             background: #F38F1D; color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/icon-192.png" alt="" />
    <h1>You're offline</h1>
    <p>The POS needs an internet connection to take payments and record sales. Check the Wi-Fi or mobile data, then try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
  <script>window.addEventListener('online', () => location.reload())</script>
</body>
</html>
